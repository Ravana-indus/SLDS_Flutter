name: CI

on:
  pull_request:
  push:
    branches: [main]

# A red build blocks merge with no override path (§8).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # §3 requires testing against the oldest supported Flutter release. Bump
  # this in step with the support window, not ahead of it.
  FLUTTER_VERSION: 3.41.1

jobs:
  tokens:
    name: Tokens (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/slds_tokens
      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: packages/slds_tokens
      - name: Dependency direction (§2)
        run: dart test test/dependency_direction_test.dart
        working-directory: packages/slds_tokens
      # Blocking as of the palette correction: every declared pair now clears
      # WCAG 2.2 AA, so a regression here is a real accessibility defect and
      # must fail the build. The corrected values are marked pending design
      # sign-off in slds_tokens/lib/src/colors.dart; if design replaces them,
      # this step is what proves the replacements still pass.
      - name: WCAG contrast (§5, §8)
        run: dart test test/contrast_test.dart
        working-directory: packages/slds_tokens
      - name: Unit tests
        run: dart test
        working-directory: packages/slds_tokens

  components:
    name: Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed packages widgetbook app

      # very_good_analysis per §8, failing on any warning or error.
      # `--no-fatal-infos` covers the remaining `info`-level items documented
      # in analysis_options.yaml. §7's public-member dartdoc rule is no longer
      # among them: the backlog is closed, so it runs at its default severity
      # and a new undocumented member fails this step directly.
      - name: Analyze (very_good_analysis)
        run: flutter analyze --no-fatal-infos
        working-directory: packages/slds_components

      - name: Colour literals (§2)
        run: dart run tool/check_literals.dart
        working-directory: packages/slds_components

      # Advisory on every push: the si/ta strings are known to be unreviewed,
      # so failing here would leave CI permanently red and train people to
      # ignore it. The release workflow runs this with --release, where §6
      # makes an unreviewed translation a blocking defect.
      - name: Translation review (§6)
        run: dart run tool/check_translation_review.dart
        working-directory: packages/slds_components

      # Behaviour, semantics and accessibility-guideline tests. Goldens are
      # excluded here — see the note on the `goldens` job below.
      - name: Tests
        run: flutter test --exclude-tags golden
        working-directory: packages/slds_components

      - name: Translation completeness (§6)
        run: flutter test test/slds_translation_completeness_test.dart
        working-directory: packages/slds_components

  goldens:
    name: Goldens
    # DEVIATION FROM §8: the guideline makes Linux the sole reference
    # platform, because font rasterisation differs across operating systems
    # even with identical font files. The committed images in this repository
    # were generated on macOS by explicit decision, so they cannot be compared
    # byte-for-byte on ubuntu-latest — this job runs on macOS to match them.
    #
    # To adopt the §8 rule: regenerate the matrix once on Linux
    # (`flutter test --update-goldens` in a Linux container), commit the
    # result, and change `runs-on` to ubuntu-latest.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Golden comparison (§8)
        run: flutter test test/slds_goldens_test.dart
        working-directory: packages/slds_components

      # A failed comparison writes the actual/diff images beside the goldens;
      # uploading them is what makes a red golden job reviewable.
      - name: Upload failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/slds_components/test/goldens/failures/
          if-no-files-found: ignore

  catalog:
    name: Widgetbook builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Regenerate use-case directory
        run: dart run build_runner build -d
        working-directory: widgetbook
      - name: Fail if the generated directory is stale
        run: git diff --exit-code widgetbook/lib/main.directories.g.dart
      - name: Build
        run: flutter build web --release
        working-directory: widgetbook
