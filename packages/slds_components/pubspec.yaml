name: slds_components
description: "Design tokens, themed widgets, and en/si/ta localization for Sri Lanka's government digital services (SLDS), by GovTech Sri Lanka."
version: 0.1.0-alpha
homepage: "https://github.com/Ravana-indus/SLDS_Flutter"
repository: "https://github.com/Ravana-indus/SLDS_Flutter"

# Not yet published. §3 requires distribution via the private pub registry;
# until slds_tokens is hosted there, this package depends on it by path, which
# a publishable package may not do. Remove this line and switch the dependency
# to a version constraint as part of the first release.
publish_to: none

# Minimum supported device floor (§1). This is a citizen-facing national
# platform, so the low end of the device range is a large share of real users,
# not an edge case: components must render and remain interactive here, not
# merely compile for it.
#
#   Android    API 24
#   iOS        15
#   Width      320dp logical minimum
#
# The Android and iOS values are pinned in the example app's
# android/app/build.gradle.kts and ios/Runner.xcodeproj. Consuming apps must
# pin the same floor themselves — a package cannot enforce it downstream.
#
# The Flutter SDK constraint below is the support window §3 requires: the last
# three stable releases, with CI testing against the oldest.
environment:
  sdk: ^3.11.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Path dependency while both packages live in this workspace. Switch to a
  # hosted version constraint against the private pub registry before
  # publishing — a publishable package can't ship a path dependency.
  slds_tokens:
    path: ../slds_tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # Google Sans covers Latin, Sinhala and Tamil in a single family, so the
  # type scale renders correctly in all three of the platform's supported
  # locales with no fallback chain. Licensed under the SIL Open Font License
  # (see fonts/OFL.txt), which permits redistribution.
  fonts:
    - family: Google Sans
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 700
